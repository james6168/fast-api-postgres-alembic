version: '3.8'


services:
  postgres:
    image: postgres:17.5-alpine3.22
    volumes:
      - postgres_data:/var/lib/postgresql/data

    env_file:
      - .env

    restart: unless-stopped

  app:
    depends_on:
      - postgres
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "8080:8080"


volumes:
  postgres_data:
    driver: local